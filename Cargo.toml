[package]
name = "vole-audio"
version = "0.3.2"
edition = "2024"
# Verified MSRV: the full host test suite (175 tests incl. the AVX-512
# kernels, which need `stdarch_x86_avx512` stabilized in 1.89) passes on
# 1.89.0 and on the current stable (1.98.0 at the time of writing). Host
# builds are stable-only; the repository pins a nightly toolchain for device
# (GPU artifact) cross-compilation — see README "Building".
rust-version = "1.89"
description = "VOLE-Audio: procedural sampling and direct audio materialization from deterministic state. One package; PCM is an observation view; SampleObject is authoritative."
keywords = ["audio", "sampler", "procedural", "gpu", "deterministic"]
categories = ["multimedia::audio", "science", "hardware-support"]
readme = "README.md"
repository = "https://github.com/infinityabundance/vole-audio"
license = "MIT OR Apache-2.0"

# Published-package hygiene: keep the crates.io tarball lean and buildable on
# stable Rust. In particular `rust-toolchain.toml` (a repo-local nightly pin
# used for GPU device cross-compilation) must never ship, and the frozen
# lookup tables under assets/u1/ (pulled in via include_bytes!) must ship.
exclude = [
    "rust-toolchain.toml",
    "scripts/",
    "receipts/",
    "corpus/",
    "docs/",
    ".gitignore",
]

# Exactly ONE Cargo package. No workspace. No internal crates.
# The GPU targets are produced by cross-compiling this same package
# (see scripts/build-cuda-device.sh and scripts/build-rocm-device.sh).

[lib]
name = "vole_audio"
path = "src/lib.rs"

[[bin]]
name = "vole-audio"
path = "src/main.rs"

[features]
default = ["std"]
# "std" is the host feature set. Device targets (nvptx64-nvidia-cuda,
# amdgcn-amd-amdhsa) compile this same package with --no-default-features
# and never see the std-only modules (backend, audio, format archive
# readers, evidence serialization, courts, CLI).
std = ["dep:libc", "dep:serde", "dep:serde_json"]
# Optional persistence adapter (H.2.21-H.2.25): the real published EntropyFS
# engine behind StoreBackend. Default-off; encoder/store governance only —
# never in the decoder or playback path (owner: docs/ENTROPYFS.md).
entropyfs-store = ["std", "dep:entropyfs"]
# Optional DSFB zero-authority search governance (H.2.26-H.2.29): the
# published drift-slew-fusion observer + the minimum deterministic observer
# in src/entropy/search/dsfb.rs. Default-off; encoder/search governance only.
dsfb = ["std", "dep:dsfb"]

[dependencies]
# Host-only. Never enabled on device targets (feature-gated above).
libc = { version = "0.2.172", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
# Real published EntropyFS engine (feature `entropyfs-store`, default-off).
# default-features = false drops the fuse/ublk/uring/tracing frontends: the
# embeddable kernel-free Engine facade (content-addressed blobs over the
# persistent store, sync IO backend) needs none of them.
entropyfs = { version = "=0.7.17", default-features = false, optional = true }
# Real published DSFB drift-slew-fusion observer (feature `dsfb`, default-off).
dsfb = { version = "=0.1.2", optional = true }

[dev-dependencies]
serde_json = "1.0"
# Independent rANS byte-parity oracle (H.2.2). TEST-ONLY: never linked into
# normative materialization. The oracle's division-based and reciprocal paths
# are byte-compatible with the frozen in-crate primitive (docs/RANS.md).
ryg-rans-rs = "0.5.1"

[profile.dev]
debug = true
overflow-checks = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = true
